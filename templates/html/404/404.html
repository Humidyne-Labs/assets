<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>404 - Access Denied</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&amp;family=Noto+Serif:ital,wght@0,300;0,400;0,500;0,600;1,400&amp;display=swap" rel="stylesheet"/>
<style>
    :root {
      --bg-color: #061423;
    }
    body {
      background-color: #061423;
      color: #e2e8f0;
      font-family: 'Noto Serif', serif;
      user-select: none;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Transparent blend overlay for smooth smoke integration */
    .smoke-layer {
      mix-blend-mode: screen;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between items-center relative overflow-hidden bg-[#061423]">
<!-- Ultra minimal atmosphere background with deep vignette -->
<div class="fixed inset-0 bg-[radial-gradient(circle_at_center,rgba(15,28,44,0.75)_0%,rgba(6,20,35,1)_85%)] pointer-events-none z-0"></div>
<!-- Full viewport canvas for uninterrupted rising smoke, cigar, ember, and ash particles -->
<canvas class="fixed inset-0 w-full h-full pointer-events-none smoke-layer z-10 block" id="cigarStage"></canvas>
<!-- Subtle Minimal Top Status -->
<header class="w-full pt-6 sm:pt-10 px-5 sm:px-8 flex justify-between items-center z-20 text-[10px] sm:text-[11px] mono tracking-widest text-slate-500/70 uppercase">
<div class="flex items-center space-x-2">
<span class="w-1.5 h-1.5 rounded-full bg-red-500/80 animate-ping"></span>
<span class="tracking-[0.22em] sm:tracking-[0.25em] text-slate-400">HTTP 404 // FORBIDDEN</span>
</div>
<div class="tracking-[0.18em] sm:tracking-[0.2em] text-slate-500/70 text-right">
<span class="hidden xs:inline">HERMETIC CHAMBER </span>SEALED
</div>
</header>
<!-- Central Visual Anchor with Telemetry Bar -->
<main class="flex-1 w-full max-w-5xl flex flex-col items-center justify-center relative z-20 px-4 sm:px-6 my-auto py-6 pointer-events-none">
<div class="relative w-full max-w-[700px] flex flex-col items-center flex-1 justify-center h-full">
<!-- Spacer to match the vertical placement of the cigar rendered on full-screen canvas -->
<div class="h-20 sm:h-24"></div>
<!-- Burn Progress Indicator Line - Minimalist & Discrete -->
<div class="w-56 sm:w-72 mt-28 sm:mt-32 flex flex-col items-center opacity-40 hover:opacity-80 transition-opacity duration-300 pointer-events-auto">
<div class="w-full bg-slate-800/80 h-[1.5px] rounded-full overflow-hidden relative">
<div class="h-full bg-amber-600/80 transition-all duration-100 ease-linear" id="burnProgressBar" style="width: 0%;"></div>
</div>
<div class="w-full flex justify-between items-center mt-2 text-[9px] sm:text-[10px] mono text-slate-500 tracking-wider">
<span id="burnLabel">BURNING CYCLE ACTIVE</span>
<span id="burnPercent">0%</span>
</div>
</div>
</div>
</main>
<!-- Ultra minimal footer navigation with touch-friendly tap targets -->
<footer class="w-full pb-6 sm:pb-10 px-5 sm:px-8 flex flex-col sm:flex-row items-center justify-between text-xs mono text-slate-500/70 z-20 gap-4 sm:gap-0">
<div class="flex items-center space-x-4 sm:space-x-6 text-[11px] tracking-wider">
<a class="py-2 px-1 hover:text-amber-300/90 transition-colors flex items-center gap-1.5 focus:outline-none focus:text-amber-200" href="javascript:history.back()">
<span>←</span> <span>RETURN</span>
</a>
<span class="text-slate-700 select-none">/</span>
<button class="py-2 px-1 hover:text-amber-300/90 transition-colors focus:outline-none focus:text-amber-200" onclick="window.location.reload()">
  RETRY TELEMETRY
</button>
</div>
<div class="text-[9px] sm:text-[10px] tracking-[0.22em] sm:tracking-[0.25em] text-slate-600 text-center sm:text-right">
  HUMIDYNE LABS • RESTRICTED
</div>
</footer>
<script>
    // Fullscreen Canvas simulation of the burning pixel-art cigar and unclipped rising smoke
    const canvas = document.getElementById('cigarStage');
    const ctx = canvas.getContext('2d');
    const progressBar = document.getElementById('burnProgressBar');
    const burnPercent = document.getElementById('burnPercent');

    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    // Cigar geometry parameters
    const cigarHeight = 34;
    const initialCigarWidth = 410; // total unburned length
    const bandOffset = 45; // position from left cap
    const bandWidth = 46;

    // Fixed burn settings
    const burnableLength = initialCigarWidth - (bandOffset + bandWidth); // 410 - 111 = 299
    const MAX_BURN_FRACTION = (burnableLength - 2) / initialCigarWidth; // stop right at edge of the gold band
    const cycleDuration = 22000; // 22 seconds for deep contemplative burn cycle
    let startTime = performance.now();

    // Ash particle simulation
    const ashTrail = [];

    // Rising smoke particles
    const smokeParticles = [];

    // Draw pixel cigar wrapper segment
    function drawPixelRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
    }

    function renderCigar(cycleRatio) {
      // Dynamic center calculation so cigar stays centered on any screen resolution
      const cigarLeft = Math.floor((W - initialCigarWidth) / 2);
      const cigarY = Math.floor(H * 0.48);
      const bx = cigarLeft + bandOffset;

      const currentBurnPercent = cycleRatio * MAX_BURN_FRACTION;
      const currentWidth = initialCigarWidth * (1 - currentBurnPercent);
      const burningTipX = cigarLeft + currentWidth;

      // 1. Shadow beneath cigar
      const shadowGrad = ctx.createRadialGradient(
        cigarLeft + currentWidth * 0.5, cigarY + cigarHeight + 18, 8,
        cigarLeft + currentWidth * 0.5, cigarY + cigarHeight + 18, currentWidth * 0.55 + 30
      );
      shadowGrad.addColorStop(0, 'rgba(2, 8, 16, 0.5)');
      shadowGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = shadowGrad;
      ctx.beginPath();
      ctx.ellipse(cigarLeft + currentWidth * 0.5, cigarY + cigarHeight + 20, Math.max(15, currentWidth * 0.52 + 15), 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Draw Cigar Body (Maduro / Natural tobacco layers with pixelated styling)
      const segments = Math.floor(currentWidth / 4);
      for (let i = 0; i < segments; i++) {
        const segX = cigarLeft + i * 4;

        // Gradient tones of cured tobacco brown
        let baseColor = '#784323';
        let highlightColor = '#94532c';
        let shadowColor = '#4e2812';

        // Organic wrap veins variations
        if (i % 8 === 0 || i % 9 === 0) {
          baseColor = '#6a391c';
          shadowColor = '#42200d';
        } else if (i % 11 === 0) {
          highlightColor = '#a86135';
        }

        // Top highlight
        drawPixelRect(segX, cigarY, 4, 6, highlightColor);
        // Core tobacco body
        drawPixelRect(segX, cigarY + 6, 4, cigarHeight - 12, baseColor);
        // Bottom shadow & tuck
        drawPixelRect(segX, cigarY + cigarHeight - 6, 4, 6, shadowColor);
        // Outer dark pixel border
        drawPixelRect(segX, cigarY - 1, 4, 1, '#1b0d06');
        drawPixelRect(segX, cigarY + cigarHeight, 4, 1, '#1b0d06');
      }

      // Rounded Head / Cap of cigar (left end)
      drawPixelRect(cigarLeft - 3, cigarY + 4, 3, cigarHeight - 8, '#5b2f15');
      drawPixelRect(cigarLeft - 6, cigarY + 8, 3, cigarHeight - 16, '#46230e');
      drawPixelRect(cigarLeft - 8, cigarY + 12, 2, cigarHeight - 24, '#2d1609');

      // 3. Elegant Embossed Cigar Band (always fully preserved & protected)
      ctx.fillStyle = '#081c30';
      ctx.fillRect(bx, cigarY - 2, bandWidth, cigarHeight + 4);

      // Gold Trim lines
      ctx.fillStyle = '#d4af37';
      ctx.fillRect(bx, cigarY - 2, bandWidth, 2);
      ctx.fillRect(bx, cigarY + cigarHeight, bandWidth, 2);
      ctx.fillRect(bx + 2, cigarY + 2, bandWidth - 4, 1);
      ctx.fillRect(bx + 2, cigarY + cigarHeight - 3, bandWidth - 4, 1);

      // Emblem Center gold diamond & monogram
      ctx.fillStyle = '#f3e5ab';
      const cx = bx + bandWidth / 2;
      const cy = cigarY + cigarHeight / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx + 8, cy);
      ctx.lineTo(cx, cy + 8);
      ctx.lineTo(cx - 8, cy);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#d4af37';
      ctx.fillRect(cx - 3, cy - 2, 6, 4);

      // 4. Burning Ember Tip (Foot of cigar)
      const emberWidth = 14;
      const emberX = burningTipX - emberWidth;

      // Dark Charred Collar before glowing ash
      drawPixelRect(emberX - 6, cigarY - 1, 6, cigarHeight + 2, '#140c08');
      drawPixelRect(emberX - 10, cigarY + 2, 4, cigarHeight - 4, '#24140b');

      // Grey Ash Cap on ember tip
      const ashCapWidth = 15;
      drawPixelRect(burningTipX - 4, cigarY + 2, ashCapWidth * 0.4, cigarHeight - 4, '#8a8d91');
      drawPixelRect(burningTipX + 2, cigarY + 5, ashCapWidth * 0.5, cigarHeight - 10, '#b8bcc2');
      drawPixelRect(burningTipX + 8, cigarY + 8, 4, cigarHeight - 16, '#616469');

      // Internal Glowing Coal / Fire pixel cluster
      const time = performance.now() * 0.005;
      const emberNoise = Math.sin(time * 3.5) * 0.5 + 0.5;

      const colors = ['#ff2a00', '#ff5900', '#ff8c00', '#ffca28', '#ffffff'];
      for (let ey = cigarY + 1; ey < cigarY + cigarHeight; ey += 3) {
        const flicker = Math.sin(ey * 12 + time * 6);
        const colIdx = Math.floor((flicker + 1) * 2);
        const sparkCol = colors[Math.min(colors.length - 1, Math.max(0, colIdx))];
        const sparkOffset = (Math.cos(ey * 7 + time * 4) + 1) * 3;
        drawPixelRect(emberX + sparkOffset, ey, 4, 2.5, sparkCol);
      }

      // Hot core point
      ctx.fillStyle = 'rgba(255, 235, 190, 0.95)';
      ctx.fillRect(burningTipX - 6, cigarY + cigarHeight / 2 - 4, 5, 8);

      // Atmospheric Ember Corona / Glow
      const glowRadius = 34 + emberNoise * 18;
      const glow = ctx.createRadialGradient(
        burningTipX, cigarY + cigarHeight / 2, 2,
        burningTipX, cigarY + cigarHeight / 2, glowRadius
      );
      glow.addColorStop(0, 'rgba(255, 95, 0, 0.45)');
      glow.addColorStop(0.4, 'rgba(255, 45, 0, 0.16)');
      glow.addColorStop(1, 'rgba(255, 30, 0, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(burningTipX, cigarY + cigarHeight / 2, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      // 5. Spawn Ash particles from glowing foot falling downwards
      if (Math.random() < 0.45) {
        ashTrail.push({
          x: burningTipX + (Math.random() * 8 - 2),
          y: cigarY + cigarHeight * 0.6 + Math.random() * 6,
          vx: (Math.random() - 0.55) * 0.35,
          vy: 0.75 + Math.random() * 1.1,
          size: 1.2 + Math.random() * 2.2,
          color: Math.random() > 0.4 ? '#8a8d91' : (Math.random() > 0.5 ? '#b2b5ba' : '#4a4d52'),
          life: 1.0,
          decay: 0.003 + Math.random() * 0.004,
          landed: false,
          floorY: cigarY + cigarHeight + 30 + Math.random() * 22
        });
      }

      // 6. Spawn Smoke Wisps gently rising from ember all the way to top of screen
      if (Math.random() < 0.55) {
        smokeParticles.push({
          x: burningTipX - 2 + (Math.random() * 8 - 4),
          y: cigarY + 2 + Math.random() * 4,
          vx: -0.28 - Math.random() * 0.42,
          vy: -1.35 - Math.random() * 0.95,
          radius: 4 + Math.random() * 3,
          maxRadius: 65 + Math.random() * 45,
          alpha: 0.36 + Math.random() * 0.16,
          life: 1.0,
          decay: 0.0012 + Math.random() * 0.0010, // Slower decay allowing smoke to reach the screen ceiling
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: 0.015 + Math.random() * 0.02
        });
      }

      return { cigarLeft, cigarY };
    }

    // Render resting ash bed
    function renderAshTrail(cigarLeft, cigarY) {
      for (let i = ashTrail.length - 1; i >= 0; i--) {
        const p = ashTrail[i];

        if (!p.landed) {
          p.x += p.vx;
          p.y += p.vy;
          p.x += Math.sin(p.y * 0.08) * 0.25;

          if (p.y >= p.floorY) {
            p.landed = true;
            p.y = p.floorY;
          }
        } else {
          p.life -= p.decay;
        }

        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life * 0.75);
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1.0;

        if (p.life <= 0) {
          ashTrail.splice(i, 1);
        }
      }

      // Faint baseline ash trail line
      ctx.strokeStyle = 'rgba(150, 160, 175, 0.07)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cigarLeft, cigarY + cigarHeight + 38);
      ctx.lineTo(cigarLeft + initialCigarWidth, cigarY + cigarHeight + 38);
      ctx.stroke();
    }

    // Render rising atmospheric smoke wisps curling freely all the way to screen top
    function renderSmoke() {
      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const s = smokeParticles[i];
        s.swayPhase += s.swaySpeed;
        s.x += s.vx + Math.sin(s.swayPhase) * 0.55;
        s.y += s.vy;
        s.radius = Math.min(s.maxRadius, s.radius + 0.18);
        s.life -= s.decay;

        // Extra natural dissipation as smoke approaches or exceeds top edge (y <= 0)
        let edgeFade = 1.0;
        if (s.y < 90) {
          edgeFade = Math.max(0, s.y / 90);
        }

        const currentAlpha = Math.max(0, s.life * s.alpha * edgeFade);

        // Soft volumetric smoke puff
        const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.radius);
        grad.addColorStop(0, `rgba(215, 228, 245, ${currentAlpha * 0.42})`);
        grad.addColorStop(0.5, `rgba(185, 202, 222, ${currentAlpha * 0.18})`);
        grad.addColorStop(1, 'rgba(185, 202, 222, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();

        // Particle lifecycle ends naturally well past screen top or when faded
        if (s.life <= 0 || s.y < -60 || currentAlpha <= 0.001) {
          smokeParticles.splice(i, 1);
        }
      }
    }

    // Main animation loop
    function animate(currentTime) {
      const elapsed = (currentTime - startTime) % cycleDuration;
      const cycleRatio = elapsed / cycleDuration; // 0.0 -> 1.0 within cycle

      if (cycleRatio < 0.02 && ashTrail.length > 120) {
        ashTrail.splice(0, 20);
      }

      const burnPct = Math.min(100, Math.round(cycleRatio * 100));
      progressBar.style.width = burnPct + '%';
      burnPercent.innerText = burnPct + '%';

      // Clear full canvas
      ctx.clearRect(0, 0, W, H);

      // Render layers
      const cigarInfo = renderCigar(cycleRatio);
      renderAshTrail(cigarInfo.cigarLeft, cigarInfo.cigarY);
      renderSmoke();

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
</script>
</body></html>
